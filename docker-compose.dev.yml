name: ems-dev

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ${EMS_BACKEND_IMAGE:-ems-backend:dev}
    command: node server_IP.js
    env_file:
      - ./server/.env.development
    ports:
      - "5000:5000"
      - "4000:4000"
    volumes:
      - "C:/CommandLogs:/var/lib/ems"
      - "C:/Snaps:/var/lib/ems/snap"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    init: true

  alarm-worker:
    image: ${EMS_BACKEND_IMAGE:-ems-backend:dev}
    command: node workers/alarmLogWorker.js
    env_file:
      - ./server/.env.development
    volumes:
      - "C:/CommandLogs:/var/lib/ems"
      - "C:/Snaps:/var/lib/ems/snap"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    init: true

  alarmcomputation-worker:
    image: ${EMS_BACKEND_IMAGE:-ems-backend:dev}
    command: node workers/alarmComputationWorker.js
    env_file:
      - ./server/.env.development
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    init: true

  snapshot-worker:
    image: ${EMS_BACKEND_IMAGE:-ems-backend:dev}
    command: node workers/snapshotWorker.js
    env_file:
      - ./server/.env.development
    volumes:
      - "C:/CommandLogs:/var/lib/ems"
      - "C:/Snaps:/var/lib/ems/snap"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    init: true

  log-worker:
    image: ${EMS_BACKEND_IMAGE:-ems-backend:dev}
    command: node workers/IncLogWorker.js
    env_file:
      - ./server/.env.development
    volumes:
      - "C:/CommandLogs:/var/lib/ems"
      - "C:/Snaps:/var/lib/ems/snap"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    init: true

  reading-worker:
    image: ${EMS_BACKEND_IMAGE:-ems-backend:dev}
    command: node workers/readingWorker.js
    env_file:
      - ./server/.env.development
    volumes:
      - "C:/CommandLogs:/var/lib/ems"
      - "C:/Snaps:/var/lib/ems/snap"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    init: true

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  rabbitmq-data: