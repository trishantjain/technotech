name: ems-prod

services:
  api:
    image: ${EMS_BACKEND_IMAGE:?Set EMS_BACKEND_IMAGE in .env.production}
    command: node server_IP.js
    env_file:
      - ./server/.env.production
    ports:
      - "5000:5000"
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/techno/ems:/var/lib/ems
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    init: true

  alarm-worker:
    image: ${EMS_BACKEND_IMAGE:?Set EMS_BACKEND_IMAGE in .env.production}
    command: node workers/alarmLogWorker.js
    env_file:
      - ./server/.env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/techno/ems:/var/lib/ems
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    init: true

  alarmcomputation-worker:
    image: ${EMS_BACKEND_IMAGE:?Set EMS_BACKEND_IMAGE in .env.production}
    command: node workers/alarmComputationWorker.js
    env_file:
      - ./server/.env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    init: true

  snapshot-worker:
    image: ${EMS_BACKEND_IMAGE:?Set EMS_BACKEND_IMAGE in .env.production}
    command: node workers/snapshotWorker.js
    env_file:
      - ./server/.env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/techno/ems:/var/lib/ems
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    init: true

  log-worker:
    image: ${EMS_BACKEND_IMAGE:?Set EMS_BACKEND_IMAGE in .env.production}
    command: node workers/IncLogWorker.js
    env_file:
      - ./server/.env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/techno/ems:/var/lib/ems
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    init: true

  reading-worker:
    image: ${EMS_BACKEND_IMAGE:?Set EMS_BACKEND_IMAGE in .env.production}
    command: node workers/readingWorker.js
    env_file:
      - ./server/.env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/techno/ems:/var/lib/ems
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    init: true

  rabbitmq:
    image: rabbitmq:3-management
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  rabbitmq-data: